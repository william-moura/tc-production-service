apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc-production-api
  labels:
    app: tc-production-service
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tc-production-service
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tc-production-service
        component: api
    spec:
      containers:
        - name: api
          image: tc-production-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tc-production-config
            - secretRef:
                name: tc-production-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3