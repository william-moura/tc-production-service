apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tc-production-api-hpa
  labels:
    app: tc-production-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tc-production-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80